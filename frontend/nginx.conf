server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        # Se resuelve "backend" en cada petición (DNS de Docker) para no quedarse
        # con una IP vieja si el contenedor del backend se reinicia.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend http://backend:8080;
        proxy_pass $backend;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Las fotos viajan en base64 dentro del JSON; el límite por defecto de nginx es 1 MB
        client_max_body_size 20m;
    }

    # Rutas de React Router (/admin, etc.)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
